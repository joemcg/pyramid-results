<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyramid week 1 test: Pyramid shapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #EEF1F4; --ink: #14202B; --surface: #FFFFFF; --hair: #D5DBE3; --muted: #4A5866;
    --echo: #F2A900; --row: #2563EB; --ski: #0D9488;
    --on-echo: #14202B; --on-row: #FFFFFF; --on-ski: #14202B;
    --num: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 400 16px/1.45 "Barlow", system-ui, sans-serif; }
  main { max-width: 430px; margin: 0 auto; padding: 16px 12px 32px; }
  h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 3px; }
  .echo { --c: var(--echo); --on: var(--on-echo); } .row { --c: var(--row); --on: var(--on-row); } .ski { --c: var(--ski); --on: var(--on-ski); }
  .box { background: var(--surface); border: 1px solid var(--hair); border-radius: 4px; padding: 14px; margin-bottom: 12px; }
  .box.off { background: transparent; border-style: dashed; padding: 10px 14px; color: #4A5866; }
  .box.off h3 { font-size: 1rem; font-weight: 600; color: var(--muted); }

  header { padding: 4px 2px 14px; }
  header h1 { font-family: var(--num); font-weight: 600; font-size: 2.6rem; line-height: 1; }
  header p { color: var(--muted); margin-top: 4px; }
  header .pill { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }

  h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: right; font-weight: 600; font-size: .85rem; padding: 2px 3px 6px; border-bottom: 1px solid var(--ink); }
  th:first-child, td:first-child { text-align: left; }
  th i { display: inline-block; width: 9px; height: 9px; background: var(--c); margin-right: 4px; border-radius: 1px; }
  td { text-align: right; padding: 5px 3px 4px; border-bottom: 1px solid var(--hair); font-family: var(--num); font-weight: 600; font-size: 1.3rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
  td:first-child { font-family: "Barlow", sans-serif; font-size: 1rem; font-weight: 600; }
  td .share { display: flex; height: 5px; margin-top: 3px; width: 100%; min-width: 48px; gap: 1px; }
  td .share b { display: block; height: 100%; background: var(--c); }
  tr.offrow td { color: #4A5866; font-family: "Barlow", sans-serif; font-weight: 400; font-size: .95rem; border-bottom-style: dashed; }
  .flag { display: block; font: 600 .72rem "Barlow", sans-serif; color: #A12A12; }
  .note { margin-top: 8px; font-size: .85rem; color: var(--muted); }
  .key { display: flex; gap: 12px; margin-top: 6px; font-size: .8rem; color: var(--muted); align-items: center; }
  .key i { display: inline-block; width: 9px; height: 9px; background: var(--c); border-radius: 1px; margin-right: 4px; }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .top h3 { font-size: 1.1rem; font-weight: 600; }
  .top .sub { color: var(--muted); font-size: .85rem; }
  .total { font-family: var(--num); font-weight: 600; font-size: 3.6rem; line-height: .9; font-variant-numeric: tabular-nums; }
  .total small { font: 400 .95rem "Barlow", sans-serif; color: var(--muted); margin-left: 4px; }

  /* pyramids */
  .py { display: grid; grid-template-columns: 26px repeat(3, 1fr); gap: 8px; margin-top: 12px; align-items: start; }
  .axis { display: grid; gap: 3px; padding-top: 0; }
  .axis span, .stack > div { height: 26px; }
  .axis span { font-size: .72rem; color: var(--muted); display: flex; align-items: center; }
  .stack { display: grid; gap: 3px; }
  .stack > div { display: flex; justify-content: center; }
  .bar { height: 100%; background: var(--c); color: var(--on); border-radius: 2px; display: flex; align-items: center; justify-content: center; font-family: var(--num); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; min-width: 30px; }
  .cap { margin-top: 6px; text-align: center; line-height: 1.15; }
  .cap .n { font-size: .85rem; font-weight: 600; display: inline-flex; gap: 5px; align-items: center; }
  .cap .n i { width: 9px; height: 9px; background: var(--c); border-radius: 1px; display: inline-block; }
  .seq { display: inline-grid; place-items: center; width: 16px; height: 16px; border: 1.5px solid var(--ink); border-radius: 50%; font-size: .68rem; font-weight: 600; }
  .cap .t { display: block; font-family: var(--num); font-weight: 600; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .legend { font-size: .78rem; color: var(--muted); margin-top: 4px; }

  details { border-top: 1px solid var(--hair); margin-top: 8px; padding-top: 8px; }
  summary { list-style: none; display: grid; grid-template-columns: 24px 1fr; gap: 8px; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }
  details[open] > summary { font-weight: 600; }
  .more { margin: 6px 0 0 32px; font-size: .92rem; color: var(--muted); }
  .more ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; }
  .more b { font-family: var(--num); font-weight: 600; font-size: 1.1rem; color: var(--ink); }
  .more i { display: inline-block; width: 9px; height: 9px; background: var(--c); margin-right: 5px; border-radius: 1px; }
  .tg { margin-top: 10px; border-top: 1px solid var(--ink); padding-top: 8px; }
  .tg .h { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .tr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; text-align: center; }
  .tr div { border-top: 3px solid var(--c, var(--ink)); padding-top: 3px; line-height: 1.15; }
  .tr .v { display: block; font-family: var(--num); font-weight: 600; font-size: 1.5rem; }
  .tr .l { display: block; font-size: .72rem; color: var(--muted); }
  .tr .l.set { color: var(--ink); font-weight: 600; }

  footer { padding: 10px 4px 0; border-top: 1px solid var(--hair); display: flex; gap: 16px; flex-wrap: wrap; font-size: .95rem; }
  footer a { color: var(--ink); text-underline-offset: 3px; }
  footer a[aria-current] { font-weight: 600; text-decoration: none; }
  @media (prefers-reduced-motion: no-preference) { .bar { animation: grow .35s ease-out backwards; } @keyframes grow { from { transform: scaleX(.6); opacity: 0; } to { transform: none; opacity: 1; } } }
</style>
</head>
<body>
<main id="app"></main>
<script src="scores.js"></script>
<script src="calc.js"></script>
<script>
(function () {
  var C = window.PyramidCalc, D = C.compute(), e = C.esc, ic = C.icon;
  var MINW = 28; // percent floor so the figure always fits inside its bar

  function summaryRow(p) {
    if (!p.tested) return '<tr class="offrow"><td>' + e(p.name) + '</td><td colspan="4">Not tested yet</td></tr>';
    var cells = D.machines.map(function (m) { return '<td>' + C.fig(p.machines[m].total) + '</td>'; }).join("");
    var share = p.incomplete ? '' : '<span class="share" role="img" aria-label="Share of total: ' + D.machines.map(function (m) { return C.NAMES[m] + ' ' + Math.round(p.machines[m].share * 100) + '%'; }).join(', ') + '">' +
      D.machines.map(function (m) { return '<b class="' + m + '" style="width:' + (p.machines[m].share * 100).toFixed(1) + '%"></b>'; }).join("") + '</span>';
    return '<tr><td>' + e(p.name) + '</td>' + cells + '<td>' + p.total + (p.incomplete ? '<span class="flag">incomplete</span>' : '') + share + '</td></tr>';
  }

  function maxRate(p) {
    var mx = 0;
    D.machines.forEach(function (m) { p.machines[m].pieces.forEach(function (v, i) { if (v != null) mx = Math.max(mx, v / C.MINUTES[i]); }); });
    return mx || 1;
  }
  function pyramids(p) {
    var mx = maxRate(p);
    var axis = '<div class="axis" aria-hidden="true">' + [3, 2, 1, 0].map(function (i) { return '<span>' + C.MINUTES[i] + ' min</span>'; }).join("") + '</div>';
    var cols = D.machines.map(function (m) {
      var mm = p.machines[m], o = p.order.indexOf(m) + 1;
      var stack = [3, 2, 1, 0].map(function (i) {
        var v = mm.pieces[i], w = v == null ? MINW : Math.max(MINW, (v / C.MINUTES[i]) / mx * 100);
        return '<div><div class="bar" style="width:' + w.toFixed(1) + '%" title="' + C.MINUTES[i] + ' min: ' + C.fig(v) + ' cal">' + C.fig(v) + '</div></div>';
      }).join("");
      return '<div class="' + m + '"><div class="stack" role="group" aria-label="' + mm.name + ' pieces">' + stack + '</div>' +
        '<div class="cap"><span class="n"><i></i>' + mm.name + '<span class="seq" aria-label="Done number ' + o + '">' + o + '</span></span><span class="t">' + C.fig(mm.total) + '</span></div></div>';
    }).join("");
    return '<div class="py">' + axis + cols + '</div><p class="legend">Bar width is calories per minute against your best rate. Bottom is the 4-min piece, top the 1-min.</p>';
  }
  function kickMore(p) {
    return '<div class="more">Kick is your 1-min pace against your 4-min pace. Above zero means you finished stronger.<ul>' +
      D.machines.map(function (m) { var k = p.machines[m].kick; return '<li class="' + m + '"><i></i>' + C.NAMES[m] + ' <b>' + (k == null ? '–' : C.signedExact(k)) + '</b></li>'; }).join("") + '</ul></div>';
  }
  function balMore(p) {
    return '<div class="more">Share of your total against the group median.<ul>' +
      D.machines.map(function (m) { var mm = p.machines[m]; return '<li class="' + m + '"><i></i>' + C.NAMES[m] + ' <b>' + (mm.share == null ? '–' : (mm.share * 100).toFixed(1) + '%') + '</b> vs ' + (mm.groupShare == null ? '–' : (mm.groupShare * 100).toFixed(1) + '%') + '</li>'; }).join("") + '</ul></div>';
  }
  function targets(p) {
    return '<div class="tg"><div class="h">' + ic('target') + 'Week 8 target</div><div class="tr">' +
      D.machines.map(function (m) { var t = p.targets[m]; return '<div class="' + m + '"><span class="v">' + C.fig(t.value) + '</span><span class="l' + (t.custom ? ' set' : '') + '">' + (t.custom ? 'set by you' : t.label) + '</span></div>'; }).join("") +
      '<div><span class="v">' + p.targetTotal + '</span><span class="l">total</span></div></div></div>';
  }
  function card(p) {
    if (!p.tested) return '<section class="box off" aria-label="' + e(p.name) + ', not tested yet"><h3>' + e(p.name) + '</h3><p>Not tested yet. Send your board photo to add your scores.</p></section>';
    return '<section class="box" aria-label="' + e(p.name) + '"><div class="top"><div><h3>' + e(p.name) + '</h3><div class="sub">Week 1 test' + (p.incomplete ? ', incomplete' : '') + '</div></div>' +
      '<div class="total">' + p.total + '<small>cal</small></div></div>' + pyramids(p) +
      '<details><summary>' + ic('kick') + '<span>' + e(p.kickInsight) + '</span></summary>' + kickMore(p) + '</details>' +
      '<details><summary>' + ic('balance') + '<span>' + e(p.balanceInsight) + '</span></summary>' + balMore(p) + '</details>' + targets(p) + '</section>';
  }

  var html = '<header><h1>Pyramid</h1><p>Week 1 test. Max calories over 4, 3, 2 and 1 minutes on each machine.</p>' +
    '<div class="pill">' + ic('clock') + D.testedCount + ' of ' + D.count + ' tested</div></header>' +
    '<section class="box"><h2>Everyone so far</h2><table><thead><tr><th scope="col">Name</th>' +
    D.machines.map(function (m) { return '<th scope="col" class="' + m + '"><i></i>' + C.NAMES[m] + '</th>'; }).join("") + '<th scope="col">Total</th></tr></thead><tbody>' +
    D.people.map(summaryRow).join("") + '</tbody></table>' +
    '<div class="key">Bar under each total: share of Echo, Row and Ski.</div><p class="note">Tested people first, no ranking.</p></section>' +
    D.people.map(card).join("") +
    '<footer><span>Other options:</span><a href="option-a-whiteboard.html">Whiteboard</a><a href="option-b-console.html">Monitor</a><a href="option-c-pyramid.html" aria-current="page">Pyramid</a></footer>';
  document.getElementById("app").innerHTML = html;
})();
</script>
</body>
</html>
